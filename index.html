function game(){const p=G.p,c=G.clubs[G.club],T2=[['painel','Painel'],['perfil','Perfil'],['elenco','Elenco'],['partida','Partida'],['treino','Treino'],['mercado','Mercado'],['fin','Finanças'],['vida','Vida'],['noticias','Notícias'],['premios','Prêmios'],['carreira','Carreira'],['comp','Competições']];

function vRetired(){const p=G.p,tot=Object.values(G.st).reduce((a,s)=>({j:a.j+s.j,g:a.g+s.g,a:a.a+s.a,m:a.m+s.m}),{j:0,g:0,a:0,m:0}),pk=Math.max(...p.hist.map(h=>h.ovr),Math.round(ovr(p.a,p.pos)));

function vPainel(){if(G.phase==='retired')return vRetired();const p=G.p,c=G.clubs[G.club],nx=G.phase==='jogo'?G.fx[G.rd].find(f=>f.includes(G.club)):null,al=[];

${kv('Situação no elenco',pr[0],pr[1])+kv('Concorrência na posição','Titular com nível '+Math.round(c.rv[p.pos]))}${kv('Condição física',Math.round(100-p.fat)+'%',p.fat>70?'neg':'')}
${kv('Forma recente (5 jogos)',p.form.length?fa.toFixed(2):'Sem jogos',fa>=7?'pos':fa&&fa<6?'neg':'')}${kv('Contrato',brl(G.contract.sal)+'/ano<div class=k>até '+G.contract.end+'</div>')}${kv('Saldo',brl(bal()),bal()<0?'neg':'')}</div>

function vPerfil(){const p=G.p,o=ovr(p.a,p.pos),dl=k=>{const d=p.a[k]-p.a0[k];return d>=.5?`<span class=pos> +${d.toFixed(1)}</span>`:d<=-.5?`<span class=neg> ${d.toFixed(1)}</span>`:''};

function vMercado(){const c=G.clubs[G.club],p=G.p,o=ovr(p.a,p.pos);
 const cards=G.offers.map(f=>{const nc=f.fc||G.clubs[f.cid],s=f.fc?ovr(p.a,p.pos)-nc.rv[p.pos]+(p.trust-50)/16:sel(f.cid),ch=s>=-1?'Alta':s>=-7?'Média':'Baixa',pros=[],cons=[];

const A={
